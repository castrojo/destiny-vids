<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Comic title card</title>
<style>
  /*
   * The intro's full-screen comic title card -- the "comic book" slide with the
   * Amber Graner quote across the bottom.
   *
   * Nothing here is designed. Every rule is COPIED from
   * `projectbluefin/website` `src/components/wolves/WolvesIntroOverlay.vue`
   * (`.wolves-intro-overlay-title-card` and friends), the same way
   * ~/Videos/wolves-{kat,natali}/render/reveal.html copies the plate CSS. The site is
   * authoritative; this is a reproduction of it, so read the component before
   * changing a value here.
   *
   * The class names keep the site's own suffixes (`-layout`, `-main`,
   * `-art-frame`, `-qr`, `-amber-quote`) so the two can be diffed by eye.
   *
   * Rendered at 1920x1080. The card's own background is opaque black, exactly
   * as the site sets it: for its window it COVERS the cinematic, which is what
   * "covering the same area" asked for.
   *
   * What the still cannot carry, and does not fake: the 0.35s cross-fade
   * between hero shots. One PNG per shot is burned back to back instead, on
   * the same slot arithmetic getComicHeroShotIndex() uses.
   */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 1920px; height: 1080px;
    overflow: hidden;
  }

  :root {
    --wc-font-weyland-mono: 'Share Tech Mono', ui-monospace, monospace;
    /* Same two stacks act.html declares, so a caption on the cover renders in
       the same face as the act slides rather than a third typeface. */
    --wc-font-display: 'Inter', 'Arial Narrow', sans-serif;
    --wc-font-mono: ui-monospace, 'SFMono-Regular', 'Cascadia Mono', monospace;
    --wc-accent: #60a5fa;
  }

  /* The Bluefin wallpaper behind the card. The site's title card is opaque
     black; act I's TITLE COVER puts a wallpaper there instead, at the owner's
     request, because the cover art is square and a 16:9 frame leaves margins
     either side of it. It sits under everything and is never drawn over the
     art. */
  .wallpaper {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
  }
  /* With a wallpaper behind it, the card's own black would hide it. */
  body.has-wallpaper { background: transparent; }
  /* A cover with no QR panel and no quote is not a hero shot beside a column:
     it IS the frame, so it takes the full height rather than the site's
     hero-shot box. Without this it renders at about a third of frame. */
  body.cover-only { padding: 0; }
  body.cover-only .layout { transform: none; width: 100%; height: 100%; }
  body.cover-only .main { width: 100%; height: 100%; display: flex;
    align-items: center; justify-content: center; }
  body.cover-only .art-frame { width: auto; height: 100%; position: relative;
    z-index: 1; }
  body.cover-only .art { height: 100%; width: auto; }

  /* CAPTION BOXES -- the cover's margins.
   *
   * The cover art is square, so at 1920x1080 it fills the middle 1080px and
   * leaves 420px of wallpaper either side. A Guardian nameplate is 561px wide
   * (tools/plate.py), so the owner's authored cover identities CANNOT be
   * plates here without covering the ink -- which the owner ruled out. They
   * are carried as caption boxes in those margins instead: same authored
   * strings, chrome that fits the space.
   *
   * The chrome is the show's own, reproduced not invented: white stock, the
   * 16px top-left/bottom-right chamfer and the #60a5fa hairline that
   * tools/plate.py draws (CHAMFER, the accent token), plus a left accent rule.
   * No tilt, by owner instruction.
   */
  .captions {
    position: absolute; inset: 0; z-index: 2;
    display: flex; justify-content: space-between; align-items: center;
    pointer-events: none;
  }
  .caption-column {
    display: flex; flex-direction: column; gap: 18px;
    width: 392px; padding: 0 14px;
  }
  .caption-column.right { align-items: flex-end; }
  /* The blue shape is the OUTER element and the white panel is nested 2px
     inside it, so the hairline reads as a stroke. Drawing it as a negative
     z-index pseudo-element does not work: clip-path opens a stacking context,
     so the layer paints over the white rather than behind it. */
  .caption {
    width: 100%;
    background: var(--wc-accent);
    padding: 2px;
    clip-path: polygon(18px 0, 100% 0, 100% calc(100% - 18px),
                       calc(100% - 18px) 100%, 0 100%, 0 18px);
    text-align: left;
  }
  .caption-inner {
    background: #fff;
    padding: 24px 22px 24px 23px;
    border-left: 3px solid var(--wc-accent);
    clip-path: polygon(16px 0, 100% 0, 100% calc(100% - 16px),
                       calc(100% - 16px) 100%, 0 100%, 0 16px);
  }
  .caption-label {
    display: block;
    font-family: var(--wc-font-mono);
    font-size: 17px; font-weight: 700;
    letter-spacing: 0.24em; text-transform: uppercase;
    color: #2563eb;
    margin-bottom: 10px;
  }
  .caption-line {
    display: block;
    font-family: var(--wc-font-display);
    font-weight: 700; font-size: 34px; line-height: 1.16;
    color: #0b0e14;
  }
  .caption-line + .caption-line { margin-top: 4px; }
  /* Rows after the first are supporting detail, not the headline. */
  .caption-line.secondary { font-size: 27px; font-weight: 600; color: #313a4a; }

  /* .wolves-intro-overlay-title-card */
  body {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: clamp(17rem, 26vh, 21rem) clamp(1.6rem, 4vw, 4rem) 19rem;
    background: #000;
    color: #fff;
    text-align: center;
  }

  /* .wolves-intro-overlay-title-card-layout */
  .layout {
    display: flex;
    align-items: center;
    gap: clamp(2rem, 4vw, 5rem);
    width: fit-content;
    max-width: 100%;
    transform: translate(-6.25vw, -5rem);
  }

  /* .wolves-intro-overlay-title-card-main */
  .main {
    display: flex;
    flex: 0 0 auto;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 0;
  }

  /* .wolves-intro-overlay-title-card-art-frame -- a square viewport that
     measures each source image by its visible alpha content. */
  .art-frame {
    position: relative;
    width: min(58vw, 50vh, 52rem);
    aspect-ratio: 1;
  }

  /* .wolves-intro-overlay-title-card-art */
  .art {
    position: absolute;
    max-width: none;
    height: auto;
    object-fit: contain;
    filter: drop-shadow(0 0 24px rgb(0 0 0 / 70%));
  }

  /* .wolves-intro-overlay-title-card-qr */
  .qr {
    display: flex;
    flex: 0 0 auto;
    flex-direction: column;
    align-items: center;
    gap: 0.9rem;
    justify-self: end;
    width: min(100%, 38rem);
    padding: 1.2rem;
    border: 1px solid rgb(147 197 253 / 32%);
    border-radius: 2rem;
    background: linear-gradient(180deg, rgb(9 11 16 / 92%) 0%, rgb(5 7 10 / 96%) 100%);
    color: #fff;
    text-decoration: none;
  }

  .qr-frame {
    width: min(100%, 32rem);
    aspect-ratio: 1;
    padding: 0.65rem;
    border-radius: 1.35rem;
    border: 1px solid rgb(147 197 253 / 45%);
    background: #020617;
    box-shadow: inset 0 0 24px rgb(59 130 246 / 14%);
  }

  .qr-image {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 0.75rem;
    filter: invert(1);
  }

  .qr-dialogue, .qr-domain {
    font-family: var(--wc-font-weyland-mono, 'Share Tech Mono', monospace);
    color: #93c5fd;
  }

  /* .wolves-intro-overlay-title-card-amber-quote */
  .amber-quote {
    position: absolute;
    bottom: clamp(12.5rem, 14vh, 13rem);
    left: 50%;
    width: min(90vw, 90rem);
    margin: 0;
    padding: 0;
    color: #fff;
    text-align: center;
    text-shadow:
      0 3px 12px rgb(0 0 0 / 95%),
      0 0 24px rgb(0 0 0 / 75%);
    transform: translateX(-50%);
  }

  .amber-quote p {
    margin: 0;
    font-family: var(--wc-font-weyland-mono, 'Share Tech Mono', monospace);
    font-size: clamp(2rem, 3.4vw, 4rem);
    line-height: 1.15;
    letter-spacing: 0.03em;
    color: #f8fafc;
    text-align: center;
  }

  .amber-attribution {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
    gap: 0.35rem;
    margin-top: 1rem;
    font-family: var(--wc-font-weyland-mono, 'Share Tech Mono', monospace);
    text-align: center;
  }

  .amber-quote strong { color: #93c5fd; font-size: clamp(1.15rem, 1.4vw, 1.6rem); }
  .amber-quote span { color: #cbd5e1; font-size: clamp(1rem, 1.2vw, 1.3rem); line-height: 1.35; }

  .hidden { display: none; }

  /*
   * --- delivery-frame overrides ------------------------------------------
   *
   * NOT site CSS. The rules above are the site's, unchanged, and at a 1080-tall
   * frame two of their viewport-relative sizes overflow the bands the card
   * itself reserves: the square art viewport is `min(58vw, 50vh, 52rem)` = 540px
   * and the QR panel resolves taller still, while the padding leaves 495px
   * between the pinned title band and the quote. In a browser that overflow is
   * hidden behind a scroll position and the widget dock; in a still it lands the
   * QR panel on top of the Amber Graner quote.
   *
   * So the two blocks are capped to the room the card reserved for them, and
   * nothing else changes: same geometry, same order, same proportions.
   */
  .layout { max-height: 100%; align-items: center; }
  .art-frame {
    flex: 0 1 auto;
    height: min(58vw, 50vh, 52rem);
    max-height: 100%;
    width: auto;
  }
  .qr { flex: 0 1 auto; max-height: 100%; height: min(100%, 38rem); }
  .qr-frame { flex: 1 1 auto; min-height: 0; width: auto; height: auto; }
</style>
</head>
<body>
  <img class="wallpaper hidden" id="wallpaper" alt="" />
  <div class="layout">
    <div class="main">
      <div class="art-frame hidden" id="art-frame">
        <img class="art" id="art" alt="" />
      </div>
    </div>
    <div class="qr hidden" id="qr">
      <div class="qr-frame">
        <img class="qr-image" id="qr-image" alt="" />
      </div>
      <span class="qr-dialogue" id="qr-dialogue"></span>
      <span class="qr-domain" id="qr-domain"></span>
    </div>
  </div>
  <blockquote class="amber-quote hidden" id="quote">
    <p id="quote-text"></p>
    <div class="amber-attribution">
      <strong id="quote-by"></strong>
      <span id="quote-note"></span>
    </div>
  </blockquote>
  <div class="captions hidden" id="captions">
    <div class="caption-column left" id="captions-left"></div>
    <div class="caption-column right" id="captions-right"></div>
  </div>
<script>
  const params = new URLSearchParams(window.location.search)

  function fill(id, value) {
    const el = document.getElementById(id)
    if (!value) { return false }
    el.textContent = value
    el.classList.remove('hidden')
    return true
  }

  const pending = []

  function loadImage(el, src) {
    return new Promise((resolve) => {
      el.addEventListener('load', () => resolve(true), { once: true })
      el.addEventListener('error', () => resolve(false), { once: true })
      el.src = src
    })
  }

  // centerComicHeroShot(): the frame measures the image's VISIBLE alpha bounds
  // and centres those in the square viewport, because the transparent canvases
  // differ shot to shot. Copied from WolvesIntroOverlay.vue.
  function centreArt(img) {
    const frame = document.getElementById('art-frame')
    const box = frame.getBoundingClientRect()
    const canvas = document.createElement('canvas')
    canvas.width = img.naturalWidth
    canvas.height = img.naturalHeight
    const ctx = canvas.getContext('2d', { willReadFrequently: true })
    ctx.drawImage(img, 0, 0)
    const { data } = ctx.getImageData(0, 0, canvas.width, canvas.height)
    let minX = canvas.width, minY = canvas.height, maxX = -1, maxY = -1
    for (let y = 0; y < canvas.height; y++) {
      for (let x = 0; x < canvas.width; x++) {
        if (data[(y * canvas.width + x) * 4 + 3] > 8) {
          if (x < minX) { minX = x }
          if (x > maxX) { maxX = x }
          if (y < minY) { minY = y }
          if (y > maxY) { maxY = y }
        }
      }
    }
    if (maxX < 0) { minX = 0; minY = 0; maxX = canvas.width - 1; maxY = canvas.height - 1 }
    const contentW = maxX - minX + 1
    const contentH = maxY - minY + 1
    const scale = Math.min(box.width / contentW, box.height / contentH)
    img.style.width = `${canvas.width * scale}px`
    img.style.left = `${(box.width - contentW * scale) / 2 - minX * scale}px`
    img.style.top = `${(box.height - contentH * scale) / 2 - minY * scale}px`
  }

  const wallpaperSrc = params.get('wallpaper')
  if (wallpaperSrc) {
    const el = document.getElementById('wallpaper')
    pending.push(loadImage(el, wallpaperSrc).then((ok) => {
      if (ok) {
        el.classList.remove('hidden')
        document.body.classList.add('has-wallpaper')
      }
    }))
  }

  const artSrc = params.get('art')
  if (artSrc) {
    const img = document.getElementById('art')
    document.getElementById('art-frame').classList.remove('hidden')
    pending.push(loadImage(img, artSrc).then((ok) => {
      if (!ok) { return }
      try {
        centreArt(img)
      } catch (error) {
        // Reading pixels back from a file:// image taints the canvas unless
        // the browser was launched with --allow-file-access-from-files. Fall
        // back to the frame's own `object-fit: contain`, which is the layout
        // the site starts from before centerComicHeroShot() refines it.
        img.style.width = '100%'
        img.style.height = '100%'
        img.style.left = '0'
        img.style.top = '0'
        window.__artFallback = String(error)
      }
    }))
  }

  const qrSrc = params.get('qr')
  if (qrSrc) {
    document.getElementById('qr').classList.remove('hidden')
    fill('qr-dialogue', params.get('qr_dialogue'))
    fill('qr-domain', params.get('qr_domain'))
    pending.push(loadImage(document.getElementById('qr-image'), qrSrc))
  }

  if (fill('quote-text', params.get('quote'))) {
    document.getElementById('quote').classList.remove('hidden')
  }
  fill('quote-by', params.get('quote_by'))
  fill('quote-note', params.get('quote_note'))

  // A card whose only content is the art takes the whole frame rather than the
  // site's hero-shot box, which sizes itself to sit beside the QR column.
  if (artSrc && !qrSrc && !params.get('quote')) {
    document.body.classList.add('cover-only')
  }

  // Caption boxes arrive as one JSON param rather than a flat key per row,
  // because each box is a variable-length stack of authored lines and there
  // may be several per side. Shape:
  //   [{ "side": "left", "label": "...", "lines": ["...", "..."] }]
  // Every string is authored copy reproduced verbatim; a key that is absent is
  // a row the card leaves out, never one it defaults.
  const captionsRaw = params.get('captions')
  if (captionsRaw) {
    const columns = {
      left: document.getElementById('captions-left'),
      right: document.getElementById('captions-right'),
    }
    let rendered = 0
    for (const caption of JSON.parse(captionsRaw)) {
      const column = columns[caption.side === 'right' ? 'right' : 'left']
      const box = document.createElement('div')
      box.className = 'caption'
      const inner = document.createElement('div')
      inner.className = 'caption-inner'
      box.appendChild(inner)
      if (caption.label) {
        const label = document.createElement('span')
        label.className = 'caption-label'
        label.textContent = caption.label
        inner.appendChild(label)
      }
      const lines = caption.lines ?? []
      lines.forEach((text, index) => {
        const line = document.createElement('span')
        line.className = index === 0 ? 'caption-line' : 'caption-line secondary'
        line.textContent = text
        inner.appendChild(line)
      })
      if (!caption.label && lines.length === 0) { continue }
      column.appendChild(box)
      rendered++
    }
    if (rendered > 0) { document.getElementById('captions').classList.remove('hidden') }
  }

  Promise.all([document.fonts.ready, ...pending]).then(() => {
    window.__renderReady = true
  })
</script>
</body>
</html>
