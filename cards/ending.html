<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Ending card</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 1920px;
    height: 1080px;
    overflow: hidden;
    background: transparent;
  }
  :root {
    --wc-gold: #60a5fa;
    --wc-white: #e9e9e5;
    --wc-font-display: 'Inter', 'Arial Narrow', sans-serif;
    --wc-font-mono: ui-monospace, 'SFMono-Regular', 'Cascadia Mono', monospace;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--wc-font-display);
  }
  body.pause {
    background-position: center;
    background-repeat: no-repeat;
    background-size: cover;
  }
  .pause-card {
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
    width: min(64rem, 90vw);
    padding: 2.4rem;
    border-left: 2px solid var(--wc-gold);
    text-shadow: 0 0.1rem 0.6rem rgb(0 0 0 / 85%);
  }
  .label {
    font-family: var(--wc-font-mono);
    font-size: 1.1rem;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--wc-gold);
  }
  .title {
    margin: 0;
    font-size: clamp(2.8rem, 5vw, 4.6rem);
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--wc-white);
    line-height: 1.1;
  }
  .overlay {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    padding: 0 90px;
    color: #f5f7fa;
    font-size: 52px;
    font-weight: 700;
    letter-spacing: 0.045em;
    text-align: center;
    text-shadow: 0 3px 12px #000, 0 0 18px rgb(0 0 0 / 90%);
  }
  .bottom_matte {
    top: 942px;
    height: 138px;
  }
  .center {
    inset: 0;
    height: 1080px;
    font-size: 86px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  .seared {
    display: inline-block;
    margin: 0 0.1em;
    color: #fff8e8;
    font-weight: 900;
    letter-spacing: 0.11em;
    text-shadow:
      0 0 4px #fff,
      0 0 12px #9dc8ff,
      0 0 28px rgb(40 116 255 / 95%),
      0 0 50px rgb(40 116 255 / 55%);
  }
</style>
</head>
<body>
<main id="card"></main>
<script>
  const params = new URLSearchParams(window.location.search)
  const mode = params.get('mode')
  const card = document.getElementById('card')

  function append(tag, className, text) {
    if (!text) return
    const node = document.createElement(tag)
    node.className = className
    node.textContent = text
    card.appendChild(node)
  }

  function appendEmphasized(text, emphasis) {
    let cursor = 0
    for (const token of emphasis) {
      const at = text.indexOf(token.text, cursor)
      if (at < 0) continue
      card.appendChild(document.createTextNode(text.slice(cursor, at)))
      const span = document.createElement('span')
      span.className = token.style
      span.textContent = token.text
      card.appendChild(span)
      cursor = at + token.text.length
    }
    card.appendChild(document.createTextNode(text.slice(cursor)))
  }

  async function ready() {
    if (mode === 'pause') {
      document.body.classList.add('pause')
      card.className = 'pause-card'
      append('div', 'label', params.get('label'))
      append('h1', 'title', params.get('title'))
      const wallpaper = params.get('wallpaper')
      if (wallpaper) {
        const image = new Image()
        image.src = wallpaper
        await image.decode()
        document.body.style.backgroundImage = `url("${wallpaper}")`
      }
    } else {
      const placement = params.get('placement') || 'bottom_matte'
      card.className = `overlay ${placement}`
      const text = params.get('text') || ''
      const emphasis = JSON.parse(params.get('emphasis') || '[]')
      appendEmphasized(text, emphasis)
    }
    await document.fonts.ready
    window.__renderReady = true
  }

  ready()
</script>
</body>
</html>
