<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Main title</title>
<style>
  /*
   * The feature's MAIN TITLE, burned over the prologue at 0:11.
   *
   * Nothing here is designed from scratch. The lockup is the site's own
   * two-line "slim" intro cue, copied from `projectbluefin/website`:
   *
   *   src/components/wolves/WolvesIntroOverlay.vue
   *     .wolves-intro-overlay-text
   *     .wolves-intro-overlay-text-slim
   *     .wolves-intro-overlay-text-slim-line1
   *     .wolves-intro-overlay-text-slim-line2
   *   src/style/wolves-cinematic.scss                (the tokens)
   *   cards/act.html                                 (the credit rows' face)
   *
   * THE COPY IS AUTHORED, NOT WRITTEN HERE. The two title lines are the exact
   * string the site's prologue already carries, at
   * `src/data/wolves-intro-sequence.ts` (the 78.5 - 94 cue):
   *
   *     'PROJECT BLUEFIN\nseven days to the wolves'
   *
   * -- reproduced verbatim, in the same order, the same way
   * stories/megacut/megacut-cards.json reproduces it for act I's slide.
   *
   * ONE DELIBERATE DIFFERENCE, and it is the owner's:
   *
   *   "Seven Days to the Wolves is the title of the whole movie so it should
   *    be featured, the project bluefin should be on top, subtle but present"
   *
   * The site gives line 1 (PROJECT BLUEFIN) the display size and line 2 the
   * small one. Here the two TREATMENTS are swapped -- the film's title takes
   * line1's size, weight and colour, and PROJECT BLUEFIN takes line2's --
   * while the authored ORDER is untouched, so Bluefin still sits on top. No
   * value is invented: both rules are the site's, applied to the other line.
   * This is the same kind of recorded, additive owner departure that act.html
   * carries for its huge Roman numerals.
   *
   * A SECOND ROW, THE CREDIT PAIR, is the owner's copy verbatim -- "Music by
   * Nightwish", "Action by Bungie" -- set in the act slide's own `.artist`
   * face so it reads as part of the deck rather than a third typeface. It is
   * NOT uppercased: it is reproduced as written.
   *
   * Rendered at 1920x1080 with a TRANSPARENT background, because this card is
   * composited over footage rather than flattened onto black. There is
   * deliberately no scrim: the frame under it at 0:11 is already near-black
   * (YAVG ~30-46), and darkening it further would only mute the picture.
   *
   * STAGED IN TWO PASSES. The owner asked for the title to settle before the
   * credits arrive, so this template renders twice and the build hard-swaps
   * one PNG for the other. BOTH cards carry the same `body`; `stage=title`
   * only makes the credit rows invisible (`visibility`, not `display`), so the
   * two PNGs are pixel-identical above the swap and the title cannot jump when
   * the credits appear.
   */
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    width: 1920px; height: 1080px;
    overflow: hidden;
    background: transparent;
  }

  /* --- src/style/wolves-cinematic.scss ------------------------------------ */
  :root {
    --wc-gold: #60a5fa;
    --wc-white: #e9e9e5;
    --wc-grey: #8b8f96;
    --wc-font-display: 'Inter', 'Arial Narrow', sans-serif;
    --wc-font-mono: ui-monospace, 'SFMono-Regular', 'Cascadia Mono', monospace;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--wc-font-display);
    /* NO SCRIM. The first pass put a radial black wash behind the lockup to
     * keep the type readable once the source cuts to a white starburst at
     * 12.28 (the eyebrow and credits were genuinely unreadable without help).
     * The owner saw it for what it was -- "remove the black translucent box
     * around the words" -- and they are right: a panel behind titles over
     * moving picture reads as a box, because it is one.
     *
     * The legibility problem is real and does not go away, so it is solved on
     * the GLYPHS instead, in `.lockup` below: a tight dark halo plus a wide
     * soft falloff, which travels with the letterforms and has no edge of its
     * own. Same protection, nothing to see. */
  }

  /* .wolves-intro-overlay-text, minus the absolute bottom-12% anchoring: a
     main title is centred rather than lower-third. */
  .lockup {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 90%;
    /* .wolves-intro-overlay-text-slim */
    font-weight: 500;
    letter-spacing: 0.03em;
    text-align: center;
    /* .wolves-intro-overlay-text gives `0 2px 18px rgb(0 0 0 / 85%)`, which is
       enough on the site's own dark backgrounds. This lockup has to survive a
       white starburst, so the same idea is stacked into a halo: a tight, nearly
       opaque core that gives every letterform its own edge, then two wider,
       softer falloffs that lift the local contrast without ever resolving into
       a shape. This is what replaced the scrim. */
    text-shadow:
      0 0 4px rgb(0 0 0 / 95%),
      0 2px 10px rgb(0 0 0 / 90%),
      0 0 28px rgb(0 0 0 / 75%),
      0 0 60px rgb(0 0 0 / 55%);
    white-space: pre-line;
  }

  /* THE OWNER'S SWAP. `.eyebrow` carries the site's line2 rules and `.title`
     carries its line1 rules; the site applies them the other way round. */

  /* .wolves-intro-overlay-text-slim-line2 */
  .eyebrow {
    display: block;
    font-size: clamp(1.8rem, 3vw, 2.6rem);
    font-weight: 400;
    letter-spacing: 0.04em;
    color: #cbd5e1;
    text-transform: uppercase;
    text-align: center;
    margin: 0 0 1.4rem;
  }

  /* WEIGHT VARIANTS FOR THE EYEBROW ONLY.

     Owner, 2026-08-16: *"the Project Bluefin is a tad too thin on the font,
     give me some options, the title itself is perfect"*. So `.title` is not
     touched by any rule below, and only PROJECT BLUEFIN moves.

     `font-weight: 500` AND `600` WOULD BE A NO-OP HERE, and that is the whole
     reason these variants are shaped the way they are. The stack is the
     site's -- 'Inter', 'Arial Narrow', sans-serif -- and Inter is not
     installed on this host (`fc-list "Inter"` is empty), so it resolves to
     DejaVu Sans, which ships Book (400) and Bold (700) and nothing between.
     CSS font matching would snap 500 down to Book and 600 up to Bold, so a
     "500/600/700" option set would really be two options wearing three names.

     The levers that DO exist on this host are four, and each variant below
     picks a different combination of them:

       WEIGHT   400 -> 700, the only real step the family has.
       STROKE   `-webkit-text-stroke`, which thickens the letterform
                CONTINUOUSLY and is the only way to get a half-step between
                Book and Bold without installing a font.
       CONTRAST #cbd5e1 -> #fff. Half of "thin" over moving picture is
                contrast, not weight: the same glyph at full white reads
                heavier without a single stroke changing.
       SIZE     a few per cent, which adds mass while keeping the letterform.

     Selected by `?variant=` -- a STYLING switch, not copy, exactly like
     `stage`. No variant means the card renders as it always has, so the
     default path is unchanged until the owner picks one. */

  /* B -- a half-step. Book letterform, thickened by stroke and lifted to
     white: heavier, still the light face the site designed. */
  body[data-variant="b"] .eyebrow {
    color: #fff;
    -webkit-text-stroke: 0.45px currentColor;
  }

  /* C -- the real Bold. Tracking comes IN slightly: 0.04em was chosen for a
     light face, and bold letterforms at that tracking read sparse. */
  body[data-variant="c"] .eyebrow {
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  /* D -- Bold, white, and 10% larger. The most present option. */
  body[data-variant="d"] .eyebrow {
    font-weight: 700;
    letter-spacing: 0.02em;
    color: #fff;
    font-size: clamp(1.98rem, 3.3vw, 2.86rem);
  }

  /* E -- heavy WITHOUT going bold: a full-pixel stroke on the Book face at
     6% larger. Keeps the open counters the Bold options close up. */
  body[data-variant="e"] .eyebrow {
    color: #fff;
    -webkit-text-stroke: 0.9px currentColor;
    font-size: clamp(1.91rem, 3.18vw, 2.76rem);
  }

  /* The blue B, at the owner's request ("don't forget the blue b" / "the words
     are fine just color in the b"). The value is NOT picked: #4285f4 is the
     published fill of the fin ligature in Project Bluefin's own wordmark
     (`ublue-os/universal-blue-org`, `content/ocis/bluefin.svg` -- see
     scripts/fetch_wordmark.py, which recolours the black type for dark
     backgrounds and leaves exactly this blue untouched). So the one coloured
     letter here carries the same value the one coloured element of the real
     mark does, rather than the site's --wc-gold (#60a5fa), which is a UI token
     and not the brand.

     Setting the mark itself was the alternative and the owner declined it:
     the words stay as type, and only the letter is accented. */
  .accent { color: #4285f4; }

  /* .wolves-intro-overlay-text-slim-line1
     ONE fitting change to the site's clamp: its max is 5.6rem, chosen for
     "PROJECT BLUEFIN". The owner's swap puts a 24-character title on this rule
     instead, which at 5.6rem runs to 88% of frame width -- close enough to the
     edges to read as cramped on a 16:9 delivery. 4.9rem leaves ~12% either
     side. The tracking is the site's and is deliberately NOT reduced: letting
     the size carry the fit keeps the letterform spacing the design specifies. */
  .title {
    display: block;
    font-size: clamp(3.2rem, 5.8vw, 4.9rem);
    font-weight: 900;
    letter-spacing: 0.12em;
    margin: 0;
    color: #fff;
    text-align: center;
    text-transform: uppercase;
    line-height: 1.1;
  }

  /* THE O IN WOLVES IS THE KUBERNETES HELM.

     Owner, 2026-08-15: *"change the o in 'Wolves' to the kubernetes symbol -
     not the blue one though, just the white symbolic one"*.

     It is CNCF's own published white icon, cached by
     scripts/fetch_brand_marks.py into renders/marks/kubernetes.png -- the helm
     alone, no wordmark, and already `fill:#fff` in the source, so nothing here
     recolours somebody's trademark.

     THE COPY IS NOT TOUCHED. The authored string is still
     'seven days to the wolves'; this substitutes a GLYPH for one letter at
     render time, the same way `.accent` colours the B of BLUEFIN without
     rewriting the eyebrow. A screen reader still reads the word, because the
     letter it replaces is its `alt`.

     Sized against the cap rather than the em so it sits on the same optical
     line as the O it stands in for, and it inherits the lockup's halo through
     `filter: drop-shadow` -- `text-shadow` does not apply to an image, and
     without this the mark would be the one element on the card with no
     protection against the 12.28 starburst. */
  /* MEASURED IN THE RENDERED FRAME, and measured correctly the third time.

     The first two attempts measured the wrong thing. `alpha > 0` catches the
     drop-shadow halo, not the mark, so the helm appeared 80 px tall and its
     centre appeared to be somewhere it was not; the halo is black, so the mark
     has to be measured as WHITE INK (luminance > 170) with the shadow
     excluded.

     What the frame actually says, at font-size 78.4 px:

         letters   y 484..537   cap height 54 px, baseline 537, centre 510.5
         the helm  y 475..537   63 px tall -- 9 px ABOVE the cap line

     So the mark was sitting ON the baseline correctly and overshooting the cap
     line by 9 px, which is exactly what reads as "not centered": its optical
     centre was 506 against the letters' 510.5.

     THE FIX IS THE HEIGHT, not a nudge. 54 / 78.4 = 0.689em makes the helm
     exactly cap-height, and because `vertical-align: baseline` already seats
     an inline image's bottom edge on the baseline, a cap-height box spans
     cap-line to baseline on its own -- the same band the O occupied. It fits
     vertically and its centre lands on the letters' centre without a single
     hand-tuned offset.

     HORIZONTALLY, equal margins are not the same as centred. The W's right
     side bearing is wide (it is a diagonal letter) and the L's left bearing is
     narrow, so symmetric margins put 11 px of air on the left and 7 px on the
     right -- the mark sat 2 px right of the optical centre of the gap. The
     slack is redistributed by that 2 px (0.026em) and the TOTAL advance is
     unchanged, so nothing after it moves. Measured, not nudged until it looked
     right. */
  .k8s-o {
    height: 0.689em;
    width: auto;
    vertical-align: baseline;
    margin: 0 0.046em 0 -0.006em;
    filter:
      drop-shadow(0 0 4px rgb(0 0 0 / 95%))
      drop-shadow(0 2px 10px rgb(0 0 0 / 90%))
      drop-shadow(0 0 28px rgb(0 0 0 / 75%));
  }

  /* cards/act.html `.hairline`, at the lockup's own width. */
  .hairline {
    width: 34%;
    height: 1px;
    margin: 2.2rem 0 0;
    background: rgb(96 165 250 / 28%);
  }

  /* The title card's third authored field. `title` / `subtitle` / `body[]` is
     the deck's full-frame card shape (docs/skills/plates/SKILL.md), and this
     template previously implemented only two of the three because the main
     title has no subtitle. The end card does -- "Salt Lake City, Utah" under
     the KubeCon line -- so the row it was always entitled to now exists. A
     card that passes no `subtitle` omits the row entirely, exactly as it
     omits a missing `label`. It takes the eyebrow's face at the eyebrow's
     size, so a card cannot arrive with a fourth typeface. */
  .subtitle {
    display: block;
    font-size: clamp(1.5rem, 2.4vw, 2.1rem);
    font-weight: 400;
    letter-spacing: 0.06em;
    color: #cbd5e1;
    text-align: center;
    margin: 1.2rem 0 0;
  }

  /* cards/act.html `.artist` -- the credit rows. The slot always occupies its
     space so the staged pair does not shift the title.
     COLOUR: act.html's `.artist` is --wc-grey (#8b8f96), which is right on a
     black slide and vanished completely over this footage even with the scrim
     in. Lifted to #cbd5e1 -- not a new value, it is the site's own secondary
     text colour, the one `.wolves-intro-overlay-text-slim-line2` uses. */
  .credits {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin: 1.8rem 0 0;
    font-family: var(--wc-font-mono);
    font-size: 1.5rem;
    letter-spacing: 0.24em;
    color: #cbd5e1;
    visibility: hidden;
  }
  .credits.shown { visibility: visible; }
  .credit-line { display: block; }

  /* TRAILER 1'S POSTER END CARD.

     Owner, 2026-08-16: *"add a large wolves.projectbluefin.io on the kubecon
     slide as a CTA. make it look awesome"*. The owner selected the poster
     direction, then corrected the background: *"no night I want day"*.

     This is a VARIANT, not a second title-card shape. The record still uses
     the deck's title / subtitle / body[] field set: event, venue, CTA, then
     tags. The first body row is merely given the hierarchy it needs to be a
     call to action and the remainder is gathered into the footer.

     THE BACKGROUND DOES THE DARKENING. build_trailer1.py puts the transparent
     card over the March Bluefin day wolves wallpaper and grades the whole
     picture down. There is no local panel under this text -- `.lockup`'s
     glyph halo is the contrast protection, exactly as it is over footage. */
  body[data-variant="poster"] .lockup { width: 92%; }
  body[data-variant="poster"] .title {
    font-size: clamp(1.7rem, 2.5vw, 2.45rem);
    letter-spacing: 0.07em;
  }
  body[data-variant="poster"] .subtitle {
    margin-top: 0.8rem;
    font-size: clamp(1.1rem, 1.7vw, 1.5rem);
  }
  body[data-variant="poster"] .hairline {
    width: 42%;
    margin-top: 1.65rem;
  }
  body[data-variant="poster"] .credits {
    margin-top: 2.25rem;
    gap: 0;
    font-family: var(--wc-font-display);
    letter-spacing: 0;
  }
  body[data-variant="poster"] .poster-cta {
    display: block;
    color: #fff;
    font-size: clamp(2.8rem, 5vw, 5.2rem);
    font-weight: 900;
    letter-spacing: 0.045em;
    line-height: 1.05;
  }
  body[data-variant="poster"] .poster-tags {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 0.75em;
    margin-top: 1.8rem;
  }
  body[data-variant="poster"] .poster-tag {
    color: #cbd5e1;
    font-family: var(--wc-font-mono);
    font-size: 1.1rem;
    letter-spacing: 0.12em;
  }

  /* THE SEAR -- the vertical glow on the `|`.

     Owner, 2026-08-16, on the credit pair: *"I want to change this: Music by
     Nightwish | Action by Bungie -- and then put the vertical glow/sear in"*,
     and later *"Sear the | again"* for the end card's own pipe.

     THE COPY IS THE OWNER'S AND IS REPRODUCED EXACTLY, pipe included. What
     changes is only how that one character is DRAWN: the font's `|` glyph is
     replaced by a rule of controlled height, because a glyph's bar is sized by
     the typeface and this one has to span the caps it divides.

     THE SEAR IS BLUE, AND IT IS NOT A NEW TREATMENT. `tools/credits.py`
     already implements it for act VIII's call to action, from the owner's own
     instruction -- *"make the filled in F's and blue sear with heat for the
     big ones"* -- and the three values below are ITS three values, not a new
     palette invented for this card:

         SEAR_FLARE  rgb(196 226 255)   the tight flare right off the stroke
         SEAR_MID    rgb(147 197 253)   ACCENT, the film's blue -- the fill
         SEAR_HALO   rgb( 37  99 235)   the deeper blue, the wide haze

     Warm was the obvious reading of the word and it is the wrong one here: in
     this film a sear is blue heat, and an amber divider would have been a
     second, contradicting definition of a treatment the owner has already
     specified once.

     IT IS GLOW, NOT A PANEL. Same rule as `.lockup`: a tight near-opaque core
     with wider soft falloffs, which travels with the mark and has no edge of
     its own. Nothing is drawn behind the type. The relative strengths follow
     `_sear`'s own gains (halo 0.34 / mid 0.36 / flare 0.26), so the divider
     glows like the letters it sits between rather than out-shouting them.

     STATIC, DELIBERATELY. This card is screenshotted to a PNG, so it carries
     no animation; the sear arrives with the credit rows at the stage swap.
     A burn-ON would need a third staged card and the swap machinery to go
     with it, which is more mechanism than the beat is worth. */
  .sear {
    display: inline-block;
    width: 3px;
    height: 1.55em;
    /* NOT equal margins, and the imbalance was MEASURED rather than reasoned.
       `.credits` tracks at 0.24em and that air lands unevenly around an
       inline-block rule. 0.86/0.62 put the bar visibly right of centre and
       0.42/0.98 put it visibly left; these are the values between them. */
    margin: 0 0.72em 0 0.62em;
    vertical-align: -0.38em;
    border-radius: 2px;
    background: linear-gradient(
      to bottom,
      rgb(147 197 253 / 0%) 0%,
      rgb(147 197 253 / 90%) 12%,
      rgb(232 244 255) 50%,
      rgb(147 197 253 / 90%) 88%,
      rgb(147 197 253 / 0%) 100%);
    box-shadow:
      0 0 4px 0 rgb(196 226 255 / 95%),
      0 0 12px 1px rgb(147 197 253 / 90%),
      0 0 30px 2px rgb(147 197 253 / 55%),
      0 0 64px 6px rgb(37 99 235 / 55%);
  }
</style>
</head>
<body>
  <div class="lockup">
    <span class="eyebrow" id="eyebrow"></span>
    <h1 class="title" id="title"></h1>
    <span class="subtitle" id="subtitle"></span>
    <div class="hairline"></div>
    <div class="credits" id="credits"></div>
  </div>
<script>
  const params = new URLSearchParams(window.location.search)

  // A STYLING switch, not copy -- the same kind of parameter as `stage`. It
  // selects one of the eyebrow weight options above; absent, the card renders
  // exactly as it did before any of them existed.
  if (params.get('variant')) {
    document.body.dataset.variant = params.get('variant')
  }

  function fill(id, value) {
    const el = document.getElementById(id)
    if (!value) { el.style.display = 'none'; return false }
    el.textContent = value
    return true
  }

  // `label` is PROJECT BLUEFIN, `title` is the film's title, and `body`
  // repeats for the credit pair -- the same keys every other card in this
  // repo uses, so the manifest needs almost no new vocabulary.
  fill('eyebrow', params.get('label'))
  fill('title', params.get('title'))
  fill('subtitle', params.get('subtitle'))

  // EVERY B AND EVERY F IS BLUE. Owner, 2026-08-15: *"Ensure every b is blue,
  // and every f is blue in all the dialogue except the chat bubbles and
  // nameplates."*
  //
  // This is a main title, so the rule applies. It supersedes the narrower
  // instruction this card was built on -- *"the words are fine just color in
  // the b"*, which lit only the B of BLUEFIN -- and the `accent` param that
  // carried it. The param is still read, and now means "this word is where the
  // rule was first asked for"; it no longer restricts the colour to one
  // letter, because the owner widened it.
  //
  // IT CHANGES NO TEXT. Every string still reads exactly as authored; only the
  // fill of two letterforms differs. Same definition as tools/blueletters.py.
  const BLUE_LETTERS = 'BbFf'

  function blueify(el) {
    if (!el) { return }
    const text = el.textContent
    if (!text) { return }
    const parts = []
    let run = ''
    for (const ch of text) {
      if (BLUE_LETTERS.includes(ch)) {
        if (run) { parts.push(document.createTextNode(run)); run = '' }
        const span = document.createElement('span')
        span.className = 'accent'
        span.textContent = ch
        parts.push(span)
      } else {
        run += ch
      }
    }
    if (run) { parts.push(document.createTextNode(run)) }
    el.textContent = ''
    el.append(...parts)
  }

  // The CTA names OUR domain, so the house b/f rule applies and its two dots
  // take the same Bluefin blue. The event title remains separate: KubeCon and
  // CloudNativeCon are Linux Foundation marks and are deliberately not
  // recoloured (the `sear(titleEl, { blue: false })` path below).
  function blueifyDomain(el) {
    if (!el) { return }
    const text = el.textContent
    if (!text) { return }
    const parts = []
    let run = ''
    for (const ch of text) {
      if (BLUE_LETTERS.includes(ch) || ch === '.') {
        if (run) { parts.push(document.createTextNode(run)); run = '' }
        const span = document.createElement('span')
        span.className = 'accent'
        span.textContent = ch
        parts.push(span)
      } else {
        run += ch
      }
    }
    if (run) { parts.push(document.createTextNode(run)) }
    el.textContent = ''
    el.append(...parts)
  }

  blueify(document.getElementById('eyebrow'))
  blueify(document.getElementById('subtitle'))

  // THE SEAR. Every ` | ` in an authored string is DRAWN as the vertical glow
  // rule instead of the typeface's pipe glyph. The string is not edited: the
  // same characters are on screen, in the same order, and one of them is a
  // rule rather than a glyph.
  //
  // Only the spaced form ` | ` is matched. A pipe inside a word is not a
  // divider, and this card should never guess which one an author meant.
  function sear(el, { blue = true } = {}) {
    if (!el) { return }
    const text = el.textContent
    if (!text || !text.includes(' | ')) {
      if (blue) { blueify(el) }
      return
    }
    const parts = text.split(' | ')
    el.textContent = ''
    parts.forEach((part, index) => {
      if (index > 0) {
        const rule = document.createElement('span')
        rule.className = 'sear'
        // The pipe is still a character of the authored string, so it is still
        // readable as one to anything that is not a camera.
        rule.setAttribute('role', 'separator')
        rule.setAttribute('aria-label', '|')
        el.appendChild(rule)
      }
      const span = document.createElement('span')
      span.textContent = part
      if (blue) { blueify(span) }
      el.appendChild(span)
    })
  }

  // THE TITLE LINE IS NOT PUT THROUGH `blueify`, and that is deliberate rather
  // than an omission. The authored title -- 'seven days to the wolves' --
  // contains no b and no f, so the rule has nothing to colour, and the mark
  // substitution below rebuilds this element's children. Running both would
  // mean one pass throwing away the other's DOM. If the title copy ever gains
  // a b or an f, the two passes have to be merged rather than ordered.
  //
  // THE END CARD'S TITLE IS THE CASE THAT ARRIVED. "KubeCon | CloudNativeCon
  // North America" has a b in it, and it is a LINUX FOUNDATION TRADEMARK set
  // as type. Recolouring a letter of somebody else's mark is not the same
  // decision as recolouring a letter of our own, so the blue rule is NOT
  // applied to the title line -- `sear` is called with `blue: false` -- and
  // the divider is drawn without touching the words. Reversible in one flag if
  // the owner wants the b; recorded in stories/trailer-1-plates.json.
  //
  // THE O IN WOLVES BECOMES THE KUBERNETES HELM. Owner, 2026-08-15.
  //
  // The word is found in the AUTHORED casing ('wolves' -- the uppercase is a
  // CSS transform, so `textContent` is still lower case), and only its single
  // `o` is replaced. Nothing else on the card is searched: "to" has an o too,
  // and the instruction named one word.
  //
  // DEGRADES. If the mark has not been cached, `onerror` puts the letter back
  // and the title renders exactly as it did before. A main title does not fail
  // because a PNG is missing.
  const titleEl = document.getElementById('title')
  const titleText = titleEl.textContent
  const wordAt = titleText.toLowerCase().lastIndexOf('wolves')
  if (wordAt !== -1) {
    const oAt = wordAt + 1                       // w-O-l-v-e-s
    const letter = titleText[oAt]
    const mark = document.createElement('img')
    mark.className = 'k8s-o'
    mark.src = '../renders/marks/kubernetes.png'
    mark.alt = letter
    mark.onerror = () => mark.replaceWith(document.createTextNode(letter))
    titleEl.textContent = ''
    titleEl.append(titleText.slice(0, oAt), mark, titleText.slice(oAt + 1))
  } else {
    sear(titleEl, { blue: false })
  }

  // THE TITLE IS FITTED, NOT TRUSTED. `.title`'s clamp was sized for a
  // 24-character film title; the end card's line is half again as long and at
  // the same size it runs off the frame. Rather than adding a per-card size
  // param nobody can check, the rendered width is MEASURED and the size walked
  // down until the line fits inside the lockup with the same ~12% of air
  // either side the main title was given. A title that already fits is not
  // touched, so this changes no existing card by a pixel.
  const FIT_WIDTH = 0.88
  if (titleEl.textContent || titleEl.children.length) {
    const limit = document.querySelector('.lockup').clientWidth * FIT_WIDTH
    let size = parseFloat(getComputedStyle(titleEl).fontSize)
    for (let i = 0; i < 40 && titleEl.scrollWidth > limit && size > 16; i++) {
      size *= 0.97
      titleEl.style.fontSize = `${size}px`
    }
  }

  // BOTH staged cards carry the same `body`, so the credit rows always occupy
  // their space and the two PNGs are identical above them. `stage` decides
  // only whether they are VISIBLE: `title` is the first beat, `credits` the
  // second. Anything else shows them, so a single unstaged card still works.
  const host = document.getElementById('credits')
  if (document.body.dataset.variant === 'poster') { host.classList.add('poster') }
  const poster = host.classList.contains('poster')
  const body = params.getAll('body')
  for (const [index, line] of body.entries()) {
    const row = document.createElement('span')
    row.textContent = line
    if (poster) {
      if (index === 0) {
        row.className = 'poster-cta'
        blueifyDomain(row)
        host.appendChild(row)
      } else {
        row.className = 'poster-tag'
        let tags = host.querySelector('.poster-tags')
        if (!tags) {
          tags = document.createElement('div')
          tags.className = 'poster-tags'
          host.appendChild(tags)
        }
        tags.appendChild(row)
      }
    } else {
      row.className = 'credit-line'
      // `sear` blueifies the words either side of the divider and draws the
      // divider itself; a row with no ` | ` in it falls straight through to
      // `blueify` and renders exactly as it always did.
      sear(row)
      host.appendChild(row)
    }
  }
  if (params.get('stage') !== 'title') { host.classList.add('shown') }

  document.fonts.ready.then(() => { window.__renderReady = true })
</script>
</body>
</html>
