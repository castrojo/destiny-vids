<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 1920px; height: 1080px; background: transparent; overflow: hidden; }
body { font-family: 'Inter', 'Arial Narrow', sans-serif; }
.card {
  position: absolute; left: 10%; top: 38%;
  width: 80%; padding: 0;
  color: #f4f6f8; text-align: center;
  text-shadow: 0 0 4px rgb(0 0 0 / 95%), 0 2px 10px rgb(0 0 0 / 90%), 0 0 28px rgb(0 0 0 / 75%);
}
.line { margin: .55rem 0; font-size: 2rem; font-weight: 800; letter-spacing: .055em; line-height: 1.12; }
</style>
</head>
<body>
<div class="card"><div class="line" id="title"></div><div class="line" id="subtitle"></div><div class="line" id="body"></div></div>
<script>
const p = new URLSearchParams(location.search)
document.getElementById('title').textContent = p.get('title') || ''
document.getElementById('subtitle').textContent = p.get('subtitle') || ''
document.getElementById('body').textContent = p.getAll('body').join(' ')
document.fonts.ready.then(() => { window.__renderReady = true })
</script>
</body>
</html>
