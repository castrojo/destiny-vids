# The gate the merge queue waits on.
#
# The suite is offline by design -- no model, no network, no footage -- so this
# is the whole check: every committed segment, video and tag file validated
# against its schema, every derived field re-derived and compared, and the cast
# list pinned so a silent change cannot re-credit a real person.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # tools/plate.py draws with DejaVu Sans Mono and refuses to substitute a
      # font, because a plate in the wrong face matches none of the other
      # videos. The runner may not carry it.
      - name: Install the plate font
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core

      - name: Install dependencies
        run: pip install --quiet jsonschema pyyaml pytest pillow pre-commit

      - name: Tests
        run: python3 -m pytest -q

      # Two derived artifacts. Each is generated from checked-in data, so a
      # stale one means somebody hand-edited what a tool owns.
      - name: Every committed corpus is current
        run: python3 tools/corpus.py --check

      - name: No derived field was hand-edited
        run: python3 tools/rederive.py --check

      # A third: the schemas' enum lists, which are vocab/ copied into JSON.
      # They were hand-maintained, and two had already drifted -- the segment
      # schema rejected six subclass_version values the vocab declares valid.
      - name: Every schema enum matches the vocabulary
        run: python3 scripts/generate_schema_enums.py --check

      # The delivery graph's first rung: did an act's committed inputs change
      # without anybody re-rendering the act? This needs no footage and no
      # ~/Videos, so it is the one delivery check that CAN run here -- and it
      # is the one that matters, because a delivered film silently predating
      # its own records is invisible until somebody watches it. Acts IV and V
      # sat a dialogue round behind for days exactly this way (#118).
      - name: No act's inputs moved without a rebuild
        run: python3 tools/deliver.py status --sources-only --check

      - name: Documentation and process checks
        run: pre-commit run --all-files
