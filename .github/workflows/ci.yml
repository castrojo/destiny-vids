# The gate the merge queue waits on.
#
# The suite is offline by design -- no model, no network, no footage -- so this
# is the whole check: every committed segment, video and tag file validated
# against its schema, every derived field re-derived and compared, and the cast
# list pinned so a silent change cannot re-credit a real person.
#
# It is ONE step on purpose. The four derived-artifact checks this workflow used
# to run as separate steps are each already asserted inside the suite --
# `tests/test_corpus.py`, `tests/test_rederive.py`, `tests/test_schema_enums.py`
# -- and pytest runs first, so the external copies could only ever execute in
# the case where they would pass. A check that is unreachable when it fails is
# ceremony; the assertions themselves are kept, in the suite, where they work.
#
# Delivery freshness is deliberately NOT here. AGENTS.md: "A gate may inform. It
# may never withhold the film." It was 17 of the last 23 CI failures, red on
# every unrelated branch, because it compares the owner's rendered masters
# against committed inputs -- a question a runner holding no footage cannot
# usefully ask. It reports from `tools/deliver.py status`, and `megacut.py`
# still charges an explicit `--allow-stale` to seat a stale act. Those are the
# checks that can actually reach a frame.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The suite takes ~50s. Without a ceiling a wedged run held the concurrency
    # group for 5h44m before anything cancelled it, and every push behind it
    # queued.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # tools/plate.py draws with DejaVu Sans Mono and refuses to substitute a
      # font, because a plate in the wrong face matches none of the other
      # videos. The runner usually already carries it, so look before
      # reaching for apt: `apt-get update` talks to a mirror, and when that
      # mirror stalls the step hangs indefinitely. That is not theoretical --
      # it is what wedged the run that held the concurrency group for 5h44m.
      - name: Install the plate font
        timeout-minutes: 5
        run: |
          if [ -f /usr/share/fonts/truetype/dejavu/DejaVuSansMono.ttf ]; then
            echo "DejaVu Sans Mono is already present"
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-dejavu-core
          fi

      - name: Install dependencies
        run: pip install --quiet jsonschema pyyaml pytest pillow

      # The runner has no ffmpeg and no footage. Anything that encodes must
      # skip, not fail -- docs/rendering.md, "Tests that touch ffmpeg must skip
      # without it".
      - name: Tests
        run: python3 -m pytest -q

