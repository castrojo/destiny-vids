# The CNCF wall's data refresh, run where the network already is.
#
# Act III closes on a wall of CNCF project logos. The SET is curated in
# vocab/cncf-projects.yaml; everything else -- names, artwork, homepages --
# is landscape data, so this job re-resolves it weekly and opens a PR when
# anything moved. `gh` uses the runner's built-in token; there is no personal
# access token in this repository and none is to be added (avatars.yml says
# why).
#
# One known GitHub limitation, recorded rather than worked around: a PR
# opened by GITHUB_TOKEN does not trigger ci.yml, so the `test` check never
# runs on these PRs and they merge with the owner's admin override. That is
# safe here by construction -- the change is a generated data file plus
# artwork, and tests/test_cncf_wall.py proves the committed record still
# matches vocab/ and renders whenever any other PR runs the suite.
name: Landscape sync

on:
  # Mondays, 06:23 UTC. Off the top of the hour: the shared runners queue
  # hardest at :00.
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write        # the sync branch
  pull-requests: write   # the PR it opens

concurrency:
  group: landscape-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # cairosvg rasterizes the landscape's SVG artwork; it is a dependency
      # of this job and of local --write runs, never of the offline suite.
      - name: Install dependencies
        run: pip install --quiet pyyaml cairosvg

      - name: Sync the landscape record
        run: python3 scripts/sync_landscape.py --write

      - name: Open a PR when anything moved
        run: |
          if git status --porcelain | grep -q .; then
            branch="chore/landscape-sync-$(date +%F)"
            git checkout -b "$branch"
            git add stories/cncf-projects.json assets/cncf-logos
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "chore(cncf): weekly landscape sync"
            git push -u origin "$branch"
            gh pr create --fill \
              --title "chore(cncf): weekly landscape sync $(date +%F)" \
              --body "Generated by the landscape-sync workflow. Data-only: stories/cncf-projects.json + assets/cncf-logos. CI does not fire on token-opened PRs; tests/test_cncf_wall.py covers the record on the next ordinary run. Merge with the admin override."
          else
            echo "the record is current; nothing to do"
          fi
