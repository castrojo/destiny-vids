    label: CONTRIBUTOR // GUARDIAN
    name: TBD
    title: Project Bluefin

derived_fields:
  casting:
    type: object
    label_source: heuristic
    # CHEAP: pure function of already-tagged fields (character, subject_salience,
    # substitutability, composition). No vision pass, no model call.
    description: >
      DERIVED per-segment casting decision. Says which tier the shot belongs to
      and, for leads, who plays it. Ensemble `person` is intentionally left null
      here — it is filled later by tools/ensemble.py once a month's contributor
      pool exists, so segment records never go stale when the pool rotates.
    fields:
      role:
        type: enum
        values:
          lead:     A named cast character is on screen; `character` and `person` identify them.
          ensemble: An anonymous Guardian slot fillable by contributors.
          none:     Neither — environment, enemy, or artifact shot with nobody to cast.
      character:
        type: [string, "null"]
        description: Canonical `leads` key matched (aka spellings normalize to it). null unless role = lead.
      person:
        type: [string, "null"]
        description: >
          The cast person's id. Set for role = lead when that character is cast;
          null for uncast leads and for ensemble (assigned later, per month).
      usable:
        type: boolean
        description: >
          Whether the shot can actually be used for `person`. True for
          unconstrained leads and for ensemble. For a CONSTRAINED binding
          (jeefy -> Saladin: far + helmeted) it is false when the shot violates
          the constraints; such a shot gets no lead boost and is excluded from
          that character's retrieval.
      constraints_failed:
        type: array
        description: >
          Constraint keys the shot fails, e.g. [require_far, require_helmet] for
          a tight, face-clear Saladin. Empty when usable, or when the binding has
          no constraints.
      slots:
        type: integer
        description: Contributor tiles this shot can carry. 0 for lead/none, >= 1 for ensemble.
    formula: >
      Normalize each character[].name to snake_case, then:
      if any name matches a `leads` key or its `aka`
        -> role = lead, character = the canonical key, person = that entry's
        `person` (may be null if uncast), slots = 0; if the binding has
        `constraints`, evaluate them: usable = (nothing failed),
        constraints_failed = the unmet keys (require_helmet fails unless
        identity_visibility is face-concealed; require_far fails unless
        shot_scale is in {ELS,LS,MLS,MS}); unconstrained leads are always usable;
      elif subject_salience in {guardian_hero, crowd_group}
        -> role = ensemble, character = null, person = null, usable = true,
        constraints_failed = [], slots = per the `ensemble.slots` formula;
      else
        -> role = none, character = null, person = null, usable = false,
        constraints_failed = [], slots = 0.

# RELATIONSHIP TO identity.yaml: `substitutability` survives, but its job
# changed. It no longer gates whether a shot is USABLE — it now only measures
# how comfortably an ensemble slot reads as "could be anyone", which is a
# tie-breaker when choosing between two otherwise equal clean shots. A
# face-clear lead shot is fully usable at substitutability 0.
