# vocab/casting.yaml
# CASTING axis — inverted.
#
# The old model was "one performer must stand in for many Guardians", which made
# anonymity a scarce resource and forced per-binding resemblance constraints
# (only usable far + helmeted, etc). That is gone. The fiction now bends to the
# footage: Bungie's cinematics ALREADY tell a good story, so we simply ASSIGN
# names to the cast that is on screen.
#
# Two tiers, and the difference between them is the whole model:
#
#   LEAD    — a named Destiny NPC is bound 1:1 to one real person. Fixed for the
#             whole project so the character reads consistently across shots.
#             Usually unconstrained: naming a role does not require a lookalike.
#             A binding MAY carry `constraints` where the project still wants the
#             figure to read as the character (jeefy -> Saladin: far + helmeted
#             only), in which case violating shots derive usable = false.
#
#   ENSEMBLE— every anonymous Guardian in frame is a SLOT, filled from a
#             rotating monthly pool of Project Bluefin contributors. The
#             cinematics are full of nameless Guardians; that crowd is the
#             project's diverse cast, and it gets filled with real people.
#             Slots are assigned programmatically by tools/ensemble.py, NOT
#             tagged by hand, so the pool can be re-rolled each month without
#             retagging a single segment.

leads:
  description: >
    Named Destiny characters bound to a real person for the life of the project.
    OPEN and EXTENSIBLE — this map is the place to add bindings. `person: null`
    means the role is written into the story but not yet cast; retrieval still
    works (the character is identified), the tile just has no name on it yet.
  entry_fields:
    person:       snake_case id of the real person cast, or null when uncast.
    display_name: How the person is credited on their tile.
    aka:          Alternate spellings/ids for the SAME character, normalized to this key.
    note:         OPTIONAL free-text standing direction for the binding. Documentation only — derivation never reads it.
    github:       >
      OPTIONAL. The person's verified GitHub login, recorded so avatar tooling
      resolves the person and never a same-named stranger's account (the
      `nimbatus`/`nimbinatus` trap — see that binding). A login is verifiable;
      a real name may not be. Documentation only — derivation never reads it.
    redacts:      >
      OPTIONAL. The real name the programme must NOT print while the redaction
      holds, mirroring the card-level fields (see `cayde_signoff` in
      scripts/build_efmb_plates.py). The enforcement is structural: a binding
      whose on-screen credit is a redaction carries NO `plate:` block, so
      tools/plate.py has no real-name copy to print and reports the character
      under `unresolved` (no_plate_copy) instead. Documentation + tests only —
      derivation never reads it.
    redaction_scope: >
      OPTIONAL with `redacts`. Where the redaction holds and where the reveal
      is, in the card field's own phrasing ("act II only -- he is revealed
      later in the programme").
    plate:        >
      OPTIONAL on-screen nameplate copy, read by tools/plate.py when it plans a
      cut's plates. Keys mirror the reference deck (~/Videos/nameplates.json):
      `label` (the uppercase eyebrow), `class`, `name`, `title` and `trustee`
      (the burnished-silver treatment), plus `kind` (`ghost` drops the class
      line, since a Ghost has no subclass) and the chrome flags: `variant`
      (`leader` is the gold treatment, and it outranks `trustee`; `rust` is
      oxidised iron; `bazzite` is purple chrome with the Bazzite logo),
      `avatar` (a portrait path or URL, shown in the crest) and `wreath`
      (`true` rings the avatar with a laurel — the maxxed-out-character
      treatment). Every key is OPTIONAL: a row the reference deck does not
      authorise is omitted, never invented, so a plate carrying only `name`
      is a valid plate. Derivation never reads it — a binding without one
      simply gets no plate.
    constraints:  >
      OPTIONAL per-binding usability constraints, for a person who does not
      resemble their character. Keys: `require_helmet` (identity_visibility must
      read as face-concealed) and `require_far` (shot_scale must be wide enough
      to hide facial detail). When present and unmet, the derived
      `casting.usable` is false and the unmet keys are listed in
      `casting.constraints_failed`; such shots are excluded from that
      character's retrieval. Most bindings have NO constraints: naming a role
      does not require a lookalike. Constraints exist only where the project
      wants the figure to read as the character rather than as the person.
  values:
    # --- CAST ------------------------------------------------------------
    elsie_bray:
      person: laura_santamaria
      display_name: Laura Santamaria
      aka: [elsie_gray, the_exo_stranger, exo_stranger]
      # Laura's Guardian identity is AUTHORED, not written here: every field is
      # verbatim from ~/src/website public/wolves/characters/characters.json
      # (slug `laura`), the same roster that authors Bob's plate below. It is
      # reproduced rather than referenced because a credit that knows an
      # authored identity must not fall back to the generic copy -- and it is
      # copied verbatim rather than paraphrased, because paraphrasing a real
      # person's credit is the same fault as inventing one.
      #
      # NAME-UNTIL-EUROPA: this plate's name row is act VII copy only. Every
      # act before VII credits her as NIMBATUS — see the `nimbatus` binding
      # below, which is the same person under the redaction (issue #103).
      plate:
        label: MAINTAINER // GUARDIAN
        class: Gunslinger Hunter
        name: Laura Santamaria
        title: The Order of Seven
    nimbatus:
      # NIMBATUS IS LAURA SANTAMARIA — "they are the same person we don't
      # reveal her real name until europa" (owner, first alpha watch; issue
      # #103). Act VII's Guardian card (82.525-88.000) is the reveal; every act
      # before it calls her NIMBATUS. The binding is what stops an earlier act
      # crediting her by her real name BY DEFAULT: the pre-reveal name resolves
      # here, and this entry carries NO `plate:` block, so tools/plate.py has
      # no copy to print and reports her under `unresolved` (no_plate_copy)
      # every time she makes a cut -- the iron_lord_red_haired posture, and the
      # same shape cayde_signoff carries in act II ("[ REDACTED ]" /
      # redacts / redaction_scope).
      #
      # THE LOGIN IS `nimbinatus`, NOT `nimbatus` — two different GitHub
      # accounts, and the wrong one matches the character name. github.com/
      # nimbinatus is Laura Santamaria (Red Hat, u/1538692); github.com/
      # nimbatus is an unrelated empty account (u/20426015). Avatar tooling
      # resolves from the `github` login, so binding her by the character
      # string would fetch a stranger's avatar onto her credit. Her pfp at
      # ~/src/website public/wolves/characters/nimbatus.webp is
      # owner-confirmed; only the login was the trap.
      #
      # NO `plate:` ON PURPOSE. Her AUTHORED Guardian identity (characters.json
      # slug `laura`) already lives on the elsie_bray binding above — and its
      # name row IS the redacted string, so it cannot be reproduced here. A
      # Guardian identity for NIMBATUS (label / class / title under that name)
      # has been authored by NOBODY: not the reference deck, not the website,
      # not an issue. TODO(owner): author it where identities are authored
      # (~/Videos/nameplates.json or the website's characters.json); tracked by
      # issue #103. Until then every plate pass over a nimbatus shot reports
      # the gap rather than filling it.
      person: laura_santamaria
      display_name: Nimbatus
      aka: []
      github: nimbinatus
      redacts: Laura Santamaria
      redaction_scope: >
        every act before VII -- she is revealed on act VII's Guardian card
        (82.525-88.000); the programme calls her NIMBATUS until Europa
    anna_bray:
      # Elsie's sister — the Bray line is the project's through-thread, so both
      # sisters are cast.
      person: joanna_lee
      display_name: Joanna Lee
      aka: [ana_bray]
    zavala:
      person: kelsey_hightower
      display_name: Kelsey Hightower
      aka: [commander_zavala]
      # Plate copy as authored in castrojo/destiny-vids#8 -- the issue IS the
      # authorisation; Kelsey has no entry in the reference deck
      # (~/Videos/nameplates.json). The subclass line names the ROLE the
      # project casts, the same way Osiris's does, so it is not read back off
      # the Titan on screen. GOLD chrome, on the owner's instruction (#33):
      # `variant: leader` is the same complete treatment Osiris carries
      # below -- the wolves overlay's `.wolves-guardian-plate-leader`.
      plate:
        label: ARCHITECT // GUARDIAN
        class: Dawnblade Warlock
        name: Kelsey Hightower
        title: Evangelist of the Open Sky
        variant: leader
    cayde_6:
      person: castrojo
      display_name: castrojo
      aka: [cayde, cayde6]
      # castrojo's Guardian identity is authored in the reference deck
      # (~/Videos/nameplates.json, np_jorge), so it lives on his LEAD binding
      # and is reproduced verbatim. Because he is cast as a lead, he is also
      # excluded from the anonymous-Guardian ensemble pool: a person cannot be
      # a named character and a nameless blueberry in the same project. He is
      # therefore credited only in cuts where Cayde-6 is actually on screen.
      plate:
        label: TRUSTEE // GUARDIAN
        class: Harbinger Titan
        name: Jorge Castro
        title: "Upender of Antipatterns | The First Disciple"
        trustee: true
    saladin:
      # CONSTRAINED binding. jeefy plays the Iron Lord, but does not resemble
      # Saladin, so the shot has to do the work: FAR and HELMETED only, where the
      # armored silhouette reads as the character. Tight or face-clear Saladin
      # derives usable = false and is excluded from retrieval. There is enough
      # far/helmeted footage for this to be a real cast rather than a compromise.
      person: jeefy
      display_name: Jeefy
      aka: [lord_saladin, iron_lord_saladin]
      constraints:
        require_helmet: true   # identity_visibility must be face-concealed
        require_far: true      # shot_scale must be wide-ish (ELS/LS/MLS/MS)
    osiris:
      person: mrbobbytables
      display_name: mrbobbytables
      aka: []
      # On-screen nameplate copy (tools/plate.py), in the same four-field form
      # as the reference deck: label / class / name / title, plus `trustee`.
      # Every field is Bob Killen's OWN plate from the deck (np_bob) -- a real
      # person's subclass is deck data, never a lore call about the character
      # they happen to play.
      #
      # `variant: leader` is the complete gold treatment from
      # WolvesIntroOverlay.vue (.wolves-guardian-plate-leader) -- the one the
      # wolves video reserves for Christoph Blecker. It takes precedence over
      # `trustee` in the CSS and in _variant_for(), so both flags are kept: Bob
      # is a trustee, and he is plated as the leader.
      plate:
        label: TRUSTEE // GUARDIAN
        class: Voidwalker Warlock
        name: Bob Killen
        title: Reconciler of the Plane
        trustee: true
        variant: leader
    sagira:
      # Osiris's Ghost. A Ghost is not a Guardian, so nothing about framing or
      # helmets applies -- she is cast on presence in frame alone.
      person: lindsay_gendreau
      display_name: Lindsay Gendreau
      aka: [sagira_ghost]
      plate:
        label: EMOTIONAL SUPPORT // GHOST
        name: Lindsay Gendreau
        # Nobody has authored a seal for Lindsay, so the title is the project's
        # standing answer for an unknown one (the owner's rule), the same as an
        # ensemble slot's.
        title: Bluefin Blueberry
        kind: ghost
    saint_14:
      person: kat
      display_name: Kat
      # STANDING NOTE, not a constraint: Saint-14 is Kat from here on, EXCEPT in
      # the original Wolves material, where she stays the bubble (Ward of Dawn).
      # Recorded so the exception is not silently lost; it does not affect
      # derivation, which has no per-binding constraints any more.
      note: >
        Kat from now on, but she remains the bubble in the original Wolves.
      aka: [saint, saint14]
      # AUTHORED identity, reproduced verbatim -- and authored twice over, which
      # is why it is safe to reproduce without asking: characters.json (slug
      # `kat`) and src/data/wolves-intro-sequence.ts in ~/src/website agree
      # field for field, and the shipped cut
      # ~/Videos/UPLOAD/01-wolves-kat-cosgrove-sentinel-titan.mp4 renders it.
      # `display_name` above stays "Kat" (how the index refers to her); the
      # plate carries her full authored name, as the deck does everywhere.
      plate:
        label: MAINTAINER // GUARDIAN
        class: Sentinel Titan
        name: Kat Cosgrove
        title: Defender Queen of the Lost
    mara_sov:
      person: karena_angell
      display_name: Karena Angell
      aka: [queen_mara_sov]
      # OWNER-SUPPLIED plate copy. Karena has NO entry in the reference deck
      # (~/Videos/nameplates.json), so there is no authored Guardian identity to
      # reproduce, and this file must never invent one -- see the
      # `ensemble.titles` comment and the Osiris/Sagira bindings, both of which
      # were corrected back to deck data for exactly this reason.
      #
      # The exception that applies here is the owner authoring copy directly,
      # which is allowed where an agent inventing it is not. Every field below
      # was supplied by the owner verbatim; they are recorded as authored, not
      # derived from anything about the character.
      #
      # RE-AUTHORED for act II (Endless Forms Most Beautiful), the show's first
      # plated act. The owner replaced the whole plate and added the wreath;
      # the previous copy is kept verbatim in the binding's `note:` so the
      # change is visible rather than silent.
      #
      # `class` is now COMPLETE: the owner authored the subclass -- Stasis --
      # which answers issue #5 ("Mara Sov plate: Karena's subclass word is
      # missing"). The row shipped as bare `Warlock` until now, one word
      # short, because the subclass was authored nowhere and picking one would
      # have put a Destiny subclass on a real person without the owner having
      # said it -- the single thing this file must never do.
      #
      # `variant: leader` is the gold treatment from WolvesIntroOverlay.vue
      # (.wolves-guardian-plate-leader). It carries over from the previous
      # authoring -- the re-authorship did not withdraw it, and the owner's
      # direction is that she and Ricardo Rocha (ensemble.titles: rochaporto)
      # are the two most senior and carry the fanciest plates in the show,
      # "like a maxxed out character in a game".
      #
      # `wreath: true` is the laurel ring around the avatar: "stylize her
      # nameplate to have a nicer wreath around her pfp, she's the most senior
      # warrior in the entire series".
      #
      # GAP: no `avatar` is set, so the wreath has no portrait to ring yet.
      # No GitHub login for Karena is recorded anywhere in this repo (the one
      # candidate spelling, `@karenaangel` in a docs/plans/wolves example,
      # does not resolve on GitHub), and a login is not an agent's to guess.
      # TODO(owner): supply Karena's GitHub login or an avatar path/URL.
      note: >
        Re-authored for act II (2026-08). Previous owner-supplied plate,
        verbatim: label "ARCHITECT // GENERAL", class "Warlock", name "Karena
        Angell", title "Archon of the Consensus", variant leader. The
        re-authorship answers issue #5: the subclass word the old class row
        lacked is now authored as Stasis, so the row reads "Stasis Warlock".
        Still open: no avatar, because no GitHub login is on record for her.
      plate:
        label: ARCHON // CONTRIBUTOR
        class: Stasis Warlock
        name: Karena Angell
        title: Architect of the Consensus
        variant: leader
        wreath: true
    petra_venj:
      # RECAST in castrojo/destiny-vids#8: the role passes from lenka to Lori
      # Lorusso. Recorded here rather than anywhere else because this file is
      # the one place a binding lives — the pinned cast test, the query phrases
      # and the plate copy all follow it.
      #
      # The recast DISPLACES lenka, who is no longer credited anywhere; the
      # issue does not say where she goes. That is a casting decision about a
      # real person — blocked_on: human — and it stays recorded (see
      # stories/02-cayde-6-the-return.md), not resolved by an agent.
      person: lori_lorusso
      display_name: Lori Lorusso
      aka: [petra]
      # Plate copy as authored in castrojo/destiny-vids#8, verbatim — including
      # the `class` spelling ("Harbringer"). Lori has no entry in the reference
      # deck, so the issue is the only authored source; on-screen copy is
      # quoted, never corrected here.
      # TODO(owner): if "Harbringer" was meant to be "Harbinger", say so.
      #
      # `variant: rust` is a chrome flag, not a new copy field: oxidised iron
      # instead of the blue chrome, for the Rust Foundation herald ("make it
      # rusted out ... but make it look cool").
      plate:
        label: HERALD // GUARDIAN
        class: Harbringer Hunter
        name: Lori Lorusso
        title: Pathfinder of the Iron Weave
        variant: rust
    variks:
      person: nate_waddington
      display_name: Nate Waddington
      aka: [variks_the_loyal]
    the_speaker:
      person: jonathan_bryce
      display_name: Jonathan Bryce
      aka: [speaker]
    amanda_holliday:
      person: ashley_willis
      display_name: Ashley Willis
      aka: [amanda, holliday]
    iron_lord_red_haired:
      # The red-haired Iron Lord who dies in the Rise of Iron intro. Her CANONICAL
      # Destiny name is UNCONFIRMED — the binding is keyed on the description so
      # the casting is not blocked on identifying her. Rename this key (and add
      # the old id to `aka`) once the character is pinned down.
      #
      # NO `plate:` ON PURPOSE. Paris has owner-written nameplate copy, but it is
      # a Guardian plate for Paris, not copy for an Iron Lord — and what a
      # character says on screen is authored, never derived or adapted. So she is
      # cast but plate-only, and tools/plate.py reports her under `unresolved`
      # (`no_plate_copy`) every time she makes a cut, rather than dropping the
      # credit. Writing copy in here is the owner's call, and the only thing that
      # closes it.
      person: paris_pittman
      display_name: Paris Pittman
      aka: [red_haired_iron_lord, dying_iron_lord]

    # --- WRITTEN, NOT YET CAST -------------------------------------------
    # Named characters that recur across the cinematics and therefore need a
    # person eventually. Fill in `person`/`display_name` to cast one.
    ikora_rey:   { person: null, display_name: null, aka: [ikora] }
    the_drifter: { person: null, display_name: null, aka: [drifter] }
    crow:        { person: null, display_name: null, aka: [uldren_sov, the_crow] }
    caiatl:      { person: null, display_name: null, aka: [empress_caiatl] }
    eris_morn:   { person: null, display_name: null, aka: [eris] }
    shaxx:       { person: null, display_name: null, aka: [lord_shaxx] }
    ghost:       { person: null, display_name: null, aka: [little_light] }
    savathun:    { person: null, display_name: null, aka: [savathun_witch_queen] }
    # DEPICTION RULE — eyes or smoke, never the body. This is a standing rule
    # for the character, not one cut's editorial choice: the Witness reads as a
    # presence, and showing its body makes it a monster instead. A shot of the
    # Witness is excluded from every cut unless a human has looked at the frame
    # and judged it eyes-or-smoke. Default is exclusion, exactly like `clean`:
    # the permission has to be positively established. Enforced at selection,
    # not derived — "is this a body or a wisp?" is a visual judgement, which
    # AGENTS.md lists among the things that can never be automated.
    the_witness:
      person: null
      display_name: null
      aka: [witness]
      depiction:
        rule: eyes_or_smoke_only
        note: >
          Never the body, never a full figure. Eyes, or smoke/vapour only.
          Add a segment_id to `approved` only after looking at the frame.
        approved: []

  # --- REQUESTED, NOT YET BOUND ----------------------------------------------
  # The exact mirror of "written, not yet cast" above: there the CHARACTER is
  # known and the person is not; here the PERSON is known and the character is
  # not. A request lands as a name and a description of a figure on screen ("the
  # woman", "the main character"), and turning that into a Destiny character is a
  # visual judgment on the footage — so it is parked here instead of guessed.
  #
  # Derivation NEVER reads this block. A pending entry casts nobody, plates
  # nothing, and needs no search phrase; it is a queue, not a binding. Promote an
  # entry by moving it into `values` under its character key, adding its search
  # phrases to tools/search.py, and deleting it from here.
  pending_fields:
    github:        The requester's identifier for the person. Verifiable; a real name may not be.
    display_name:  How they are credited, when the request said. null when nobody has said yet.
    described_as:  The requester's words for the figure on screen, quoted. Never paraphrased into a character name.
    requested_in:  Where the request came from.
    source_video:  The footage the request is about. Not necessarily indexed yet.
    automatable:   Whether an agent can settle this alone. `no` for anything that names a real person.
    blocked_on:    What has to happen first, in one sentence.
  pending:
    inffy:
      # The owner cast the Hunter run in the Final Shape Gameplay Trailer
      # (source 90.791-95.225) onto this account, EXPLICITLY OVERRIDING their
      # own file name for the clip, which said "Laura":
      #
      #   "the warlock should be kaslin fields and the hunter was laura
      #    santamaria but make it github.com/inffy"
      #
      # The override is recorded because the proxy file
      # ~/Videos/wolves-directors-cut/UchfadQhX7w_Laura_91-97.mp4 still carries
      # the old name, and a wrong credit is not recoverable by a revert.
      #
      # No Guardian identity is authored for inffy anywhere: not
      # ~/Videos/nameplates.json, not the website's characters.json. The name
      # appears only as a callsign in the website's wolves-track-zero-manifest,
      # which is not a plate. So the run is rendered UNPLATED and no copy is
      # written here -- a missing name is omitted and recorded, never invented.
      github: inffy
      display_name: null   # nobody has authored one; a plate must not invent it
      described_as: the hunter
      requested_in: owner instruction, editorial pass on Seven Days to the Wolves
      source_video: https://www.youtube.com/watch?v=UchfadQhX7w
      automatable: no
      blocked_on: >
        No authored Guardian identity exists for this account. Author one where
        identities are authored -- ~/src/website public/wolves/characters/characters.json
        or ~/Videos/nameplates.json -- and the binding can move into `values`
        with its plate reproduced verbatim.
    # wrkode (William Rizzo) was parked here by issue #14 ("Add william rizzo
    # and team", described_as "Main character") until the owner authored his
    # plate for act II -- he is PROMOTED to `ensemble.titles` below, which
    # partially closes #14. Which Destiny character he is stays open: the #14
    # source video (dOdPT9fLKEA) is still not ingested, and naming the figure
    # from the footage is the visual judgement the pending entry waited on.
    abangser:
      github: abangser
      display_name: null   # not given in the request; a plate must not invent one
      described_as: Woman
      requested_in: https://github.com/castrojo/destiny-vids/issues/14
      source_video: https://www.youtube.com/watch?v=dOdPT9fLKEA
      automatable: no
      blocked_on: >
        The source video is not ingested, so no indexed shot shows this figure.
        Ingest and index it, then name the character from the footage.
    robertsirc:
      github: robertsirc
      display_name: null   # not given in the request; a plate must not invent one
      described_as: other guy
      requested_in: https://github.com/castrojo/destiny-vids/issues/14
      source_video: https://www.youtube.com/watch?v=dOdPT9fLKEA
      automatable: no
      blocked_on: >
        The source video is not ingested, so no indexed shot shows this figure.
        Ingest and index it, then name the character from the footage.

ensemble:
  description: >
    The anonymous-Guardian crowd, cast from Project Bluefin contributors. The
    pool is rebuilt per calendar month by tools/ensemble.py from repository
    contribution history, then deterministically assigned to the ensemble slots
    across a shot list, producing one credit TILE per contributor.
  plate:
    description: >
      On-screen nameplate copy for an ensemble credit, read by tools/plate.py.
      Same closed field set as a lead's `plate:` block. The eyebrow depends on
      whether the person is a member of the GitHub org: a maintainer is not a
      passing contributor and the credit should not say they are.

      `label_unknown` exists because org membership is a lookup that can fail
      (no network, no token, insufficient scope). Failing to read it is NOT
      evidence that someone is not a maintainer, so it gets the neutral
      GUARDIAN eyebrow rather than silently demoting the whole cast.
    label: CONTRIBUTOR // GUARDIAN        # not in the org
    label_member: MAINTAINER // GUARDIAN  # in the org
    label_unknown: GUARDIAN               # membership could not be read
    # A Destiny "title" is a seal, and we do not know anyone's. "Blueberry" is
    # the in-game name for an unnamed Guardian you get randomly grouped with,
    # which is exactly what an ensemble slot is.
    title: Bluefin Blueberry
    # The headline of the roster card that closes the cut (the title card's
    # `title` field). Owner-supplied copy; the card's `subtitle` carries the
    # month context and is assembled by tools/plate.py from the roster key.
    roster_title: Thanks for working on Bluefin!
  # AUTHORED Guardian identities for individual contributors, keyed by GitHub
  # login. Most contributors are anonymous Guardians: nobody knows their seal,
  # so they get the generic plate copy above. A few people's Guardian identity
  # is genuinely authored in the reference deck (~/Videos/nameplates.json), and
  # a credit that knows it must reproduce it verbatim, never a paraphrase and
  # never the generic fallback. tools/plate.py prefers an entry here over the
  # generic copy wherever the person lands, including over the tail sign-off
  # card, which never flattens an authored identity into a name line while the
  # cut still has room for the real plate.
  #
  # A person CAST AS A LEAD does not belong here: their identity lives on the
  # lead binding, and they are excluded from the ensemble pool entirely. That
  # is why castrojo is not in this map -- he is Cayde-6, so his plate is on the
  # `cayde_6` binding above and he is credited only where Cayde is on screen.
  #
  # Add a login ONLY with copy that exists in the deck or that the OWNER
