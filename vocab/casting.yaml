ensemble:
  description: 'The anonymous-Guardian crowd, cast from Project Bluefin contributors. The pool is rebuilt
    per calendar month by tools/ensemble.py from repository contribution history, then deterministically
    assigned to the ensemble slots across a shot list, producing one credit TILE per contributor.

    '
  plate:
    description: 'On-screen nameplate copy for an ensemble credit, read by tools/plate.py. Same closed
      field set as a lead''s `plate:` block. The eyebrow depends on whether the person is a member of
      the GitHub org: a maintainer is not a passing contributor and the credit should not say they are.

      `label_unknown` exists because org membership is a lookup that can fail (no network, no token, insufficient
      scope). Failing to read it is NOT evidence that someone is not a maintainer, so it gets the neutral
      GUARDIAN eyebrow rather than silently demoting the whole cast.

      '
    label: CONTRIBUTOR // GUARDIAN
    label_member: MAINTAINER // GUARDIAN
    label_unknown: GUARDIAN
    title: Bluefin Blueberry
    roster_title: Thanks for working on Bluefin!
  placeholders:
    description: 'People the owner named (for act II) with no plate copy authored yet. A queue, not copy:
      nothing here renders. `missing` lists the rows a plate would still need, every one of them the owner''s
      to write.

      '
    dylan_taylor:
      name: Dylan Taylor
      github: null
      missing:
      - label
      - class
      - title
      - chrome
      - avatar
    ahmedadan:
      name: Ahmed Adan
      github: ahmedadan
      missing:
      - label
      - class
      - title
      - chrome
      - avatar
    troy:
      name: Troy
      github: null
      missing:
      - label
      - class
      - title
      - chrome
      - avatar
  org:
    description: 'GitHub organisation whose members are credited as maintainers. Recorded per roster by
      tools/ensemble.py as `org_member` on each contributor: true, false, or null when the lookup failed.

      '
    value: projectbluefin
  pool:
    source: Project Bluefin repositories, contributions within a calendar month.
    rotation: monthly
    assignment: 'Deterministic round-robin over the month''s contributors, seeded by the month key, walking
      the shot list in timeline order and filling each segment''s ensemble `slots`. Contributors are reused
      only after every member of the pool has been placed at least once.

      '
  slots:
    description: 'How many ensemble Guardians a shot can credit — the number of distinct anonymous bodies
      plausibly in frame. DERIVED, not tagged: a ''group'' or ''crowd'' composition carries a fireteam''s
      worth, a solo shot carries one.

      '
    formula: 'role != ensemble                              -> 0; composition contains crowd                    ->
      6; composition contains group, or subject_salience == crowd_group -> 3; otherwise                                     ->
      1.

      '
  placeholder_plate:
    label: CONTRIBUTOR // GUARDIAN
    name: TBD
    title: Project Bluefin
derived_fields:
  casting:
    type: object
    label_source: heuristic
    description: 'DERIVED per-segment casting decision. Says which tier the shot belongs to and, for leads,
      who plays it. Ensemble `person` is intentionally left null here — it is filled later by tools/ensemble.py
      once a month''s contributor pool exists, so segment records never go stale when the pool rotates.

      '
    fields:
      role:
        type: enum
        values:
          lead: A named cast character is on screen; `character` and `person` identify them.
          ensemble: An anonymous Guardian slot fillable by contributors.
          none: Neither — environment, enemy, or artifact shot with nobody to cast.
      character:
        type:
        - string
        - 'null'
        description: Canonical `leads` key matched (aka spellings normalize to it). null unless role =
          lead.
      person:
        type:
        - string
        - 'null'
        description: 'The cast person''s id. Set for role = lead when that character is cast; null for
          uncast leads and for ensemble (assigned later, per month).

          '
      usable:
        type: boolean
        description: 'Whether the shot can actually be used for `person`. True for unconstrained leads
          and for ensemble. For a CONSTRAINED binding (jeefy -> Saladin: far + helmeted) it is false when
          the shot violates the constraints; such a shot gets no lead boost and is excluded from that
          character''s retrieval.

          '
      constraints_failed:
        type: array
        description: 'Constraint keys the shot fails, e.g. [require_far, require_helmet] for a tight,
          face-clear Saladin. Empty when usable, or when the binding has no constraints.

          '
      slots:
        type: integer
        description: Contributor tiles this shot can carry. 0 for lead/none, >= 1 for ensemble.
    formula: "Normalize each character[].name to snake_case, then: if any name matches a `leads` key or\
      \ its `aka`\n  -> role = lead, character = the canonical key, person = that entry's\n  `person`\
      \ (may be null if uncast), slots = 0; if the binding has\n  `constraints`, evaluate them: usable\
      \ = (nothing failed),\n  constraints_failed = the unmet keys (require_helmet fails unless\n  identity_visibility\
      \ is face-concealed; require_far fails unless\n  shot_scale is in {ELS,LS,MLS,MS}); unconstrained\
      \ leads are always usable;\nelif subject_salience in {guardian_hero, crowd_group}\n  -> role = ensemble,\
      \ character = null, person = null, usable = true,\n  constraints_failed = [], slots = per the `ensemble.slots`\
      \ formula;\nelse\n  -> role = none, character = null, person = null, usable = false,\n  constraints_failed\
      \ = [], slots = 0.\n"
