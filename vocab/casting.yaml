leads:
  description: 'Named Destiny characters bound to a real person for the life of the project. OPEN and
    EXTENSIBLE — this map is the place to add bindings. `person: null` means the role is written into
    the story but not yet cast; retrieval still works (the character is identified), the tile just has
    no name on it yet.

    '
  entry_fields:
    person: Verified GitHub login for the person cast, or null when uncast.
    aka: Alternate spellings/ids for the SAME character, normalized to this key.
    note: OPTIONAL free-text standing direction for the binding. Documentation only — derivation never
      reads it.
    redacts: 'OPTIONAL. The real name the programme must NOT print while the redaction holds, mirroring
      the card-level fields (see `cayde_signoff` in scripts/build_efmb_plates.py). The enforcement is
      structural: a binding whose on-screen credit is a redaction carries NO `plate:` block, so tools/plate.py
      has no real-name copy to print and reports the character under `unresolved` (no_plate_copy) instead.
      Documentation + tests only — derivation never reads it.

      '
    redaction_scope: 'OPTIONAL with `redacts`. Where the redaction holds and where the reveal is, in the
      card field''s own phrasing ("act II only -- he is revealed later in the programme").

      '
    constraints: 'OPTIONAL per-binding usability constraints, for a person who does not resemble their
      character. Keys: `require_helmet` (identity_visibility must read as face-concealed) and `require_far`
      (shot_scale must be wide enough to hide facial detail). When present and unmet, the derived `casting.usable`
      is false and the unmet keys are listed in `casting.constraints_failed`; such shots are excluded
      from that character''s retrieval. Most bindings have NO constraints: naming a role does not require
      a lookalike. Constraints exist only where the project wants the figure to read as the character
      rather than as the person.

      '
  values:
    elsie_bray:
      person: nimbinatus
      aka:
      - elsie_gray
      - the_exo_stranger
      - exo_stranger
    nimbatus:
      person: nimbinatus
      aka: []
      redacts: Laura Santamaria
      redaction_scope: 'every act before VII -- she is revealed on act VII''s Guardian card (82.525-88.000);
        the programme calls her NIMBATUS until Europa

        '
    anna_bray:
      person: joannalee
      aka:
      - ana_bray
    zavala:
      person: kelseyhightower
      aka:
      - commander_zavala
    cayde_6:
      person: castrojo
      aka:
      - cayde
      - cayde6
    saladin:
      person: jeefy
      aka:
      - lord_saladin
      - iron_lord_saladin
      constraints:
        require_helmet: true
        require_far: true
    osiris:
      person: mrbobbytables
      aka: []
    sagira:
      person: clubanderson
      aka:
      - sagira_ghost
    fynch:
      person: idvoretskyi
      aka: []
    saint_14:
      person: katcosgrove
      note: 'Kat from now on, but she remains the bubble in the original Wolves.

        '
      aka:
      - saint
      - saint14
    mara_sov:
      person: kdruckman
      aka:
      - queen_mara_sov
    petra_venj:
      person: LoriLorusso
      aka:
      - petra
    variks:
      person: nate-double-u
      aka:
      - variks_the_loyal
    the_speaker:
      person: jbryce
      aka:
      - speaker
    amanda_holliday:
      person: ashleywillis
      aka:
      - amanda
      - holliday
    iron_lord_red_haired:
      person: parispittman
      aka:
      - red_haired_iron_lord
      - dying_iron_lord
    ikora_rey:
