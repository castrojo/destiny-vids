# vocab/provenance.yaml
# Provenance axis: where each field value came from and how much to trust it.
# Every labeled field in the schema carries source, label_source, and confidence.

source:
  # NOTE: source video metadata (YouTube title/description/tags/playlist) sets
  # VIDEO-SCOPED 'inherited' defaults — e.g. a "The Final Shape Launch Trailer"
  # video inherits era=the_final_shape for all its shots unless overridden by
  # observation at shot level.
  description: Whether a value was inherited from enclosing scope or observed at this level.
  values:
    inherited: Value propagated from video/playlist-level metadata defaults.
    observed:  Value determined directly from this shot's evidence.

label_source:
  description: Who/what produced the label.
  values:
    manual:    Labeled by a human.
    heuristic: Labeled by a deterministic rule/derivation (e.g. subclass_version from era).
    model:     Labeled by a machine-learning model (captioner, classifier, VLM).

confidence:
  description: Confidence in the label, 0.0 (guess) to 1.0 (certain).
  type: float
  range: [0.0, 1.0]

usage_class:
  description: >
    Copyright/usage classification of the underlying asset — footage, or a
    music bed. This axis exists so an asset can say it is CLEARED, not only
    that it is somebody else's. Until 2026-08-13 it held exactly one value, so
    the index had no way to record a track whose licence already permits the
    use, and a cleared asset kept being written up as a rights block.
  values:
    third_party_copyrighted: >
      A copyrighted work this project does not own, indexed for non-infringing
      reference/retrieval: timestamps and measurements are returned, never the
      media. Bungie footage is the common case, but the class is the RIGHTS
      POSITION and not the rightsholder -- a Nuclear Blast concert recording
      used as bed and picture sits here too. Non-commercial fan use only, on
      every record and therefore on the whole programme.
    cc_by_4_0: >
      Creative Commons Attribution 4.0. Commercial use, sync and
      redistribution are all permitted; attribution is the only condition and
      is NOT optional. A record carrying this value must have its required
      credit string reproduced verbatim in ATTRIBUTIONS.md. Not CC0, and not
      a reason to stop: choosing among assets that already carry this value is
      taste, not a licensing decision.
